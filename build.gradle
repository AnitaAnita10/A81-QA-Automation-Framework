plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.6.1'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.0.1'

    implementation 'com.opencsv:opencsv:5.7.1'

    testImplementation 'io.cucumber:cucumber-testng:7.34.3'
    testImplementation 'io.cucumber:cucumber-core:7.34.3'
    testImplementation 'io.cucumber:cucumber-java:7.34.3'



}

test {
    useTestNG() {
        suites "src/test/resources/TestNG.xml"
        systemProperty "browser", System.getProperty("browser")
    }
}